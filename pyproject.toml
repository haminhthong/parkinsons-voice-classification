[project]
name = "parkinsons-voice-classification"
version = "1.0.0"
description = "Leakage-aware Parkinson voice classification at patient level"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --basetemp=reports/.pytest-tmp"
cache_dir = "reports/.pytest-cache"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
